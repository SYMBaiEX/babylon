# Local CI workflow optimized for act (local GitHub Actions runner)
# Run with: bun run test:act (or: act -W .github/workflows/local-ci.yml)
#
# This workflow is designed to run locally using nektos/act
# It mirrors the production CI but with optimizations for local execution
#
# ⚠️ APPLE SILICON LIMITATION:
# Prisma's Rust-based CLI binary crashes under x86_64 emulation (Rosetta 2).
# This workflow may not work reliably on M1/M2/M3 Macs.
# For CI testing on Apple Silicon, use: bun run test (runs tests natively)
# or push to GitHub to run actual CI.

name: Local CI

on:
  workflow_dispatch:
  push:
    branches: [local-test]

env:
  NODE_ENV: test
  CI: true
  DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
  REDIS_URL: redis://localhost:6381

jobs:
  # Combined job for local development (faster than multiple jobs)
  local-ci:
    name: Local CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=512mb
        ports:
          - 5434:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6381:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          # Install all dependencies (postinstall runs prisma generate)
          # Note: May fail on Apple Silicon due to Prisma binary issues under emulation
          bun install

      - name: Setup test environment
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          PRIVY_TEST_EMAIL: ${{ secrets.PRIVY_TEST_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REDIS_URL: redis://localhost:6381
          # Skip E2E checks since local CI doesn't run E2E tests
          SKIP_E2E_CHECKS: true
        run: |
          echo "📋 Setting up test environment..."
          if [ -f scripts/ci/prepare-env.sh ]; then
            bash scripts/ci/prepare-env.sh
          else
            echo "NODE_ENV=test" > .env.test
            echo "CI=true" >> .env.test
            echo "DATABASE_URL=$DATABASE_URL" >> .env.test
            echo "DIRECT_DATABASE_URL=$DIRECT_DATABASE_URL" >> .env.test
            echo "REDIS_URL=$REDIS_URL" >> .env.test
          fi

      - name: Setup Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
        run: |
          echo "🗄️ Setting up database..."
          # Push the schema to the database (skip generate since already done in install)
          bunx prisma db push --skip-generate --accept-data-loss

      - name: Type Check
        run: |
          echo "📝 Running type check..."
          bun run typecheck

      - name: Lint
        run: |
          echo "✨ Running linter..."
          bun run lint

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
        run: |
          echo "🏗️ Building project..."
          bun run build

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
          REDIS_URL: redis://localhost:6381
        run: |
          echo "🧪 Running unit tests..."
          bun test tests/unit/ --preload ./tests/unit/preload.ts

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/test_db
          REDIS_URL: redis://localhost:6381
          TEST_API_URL: http://localhost:3000
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🔗 Running integration tests..."
          bun test tests/integration/ tests/deployment/ tests/markets-pnl-sharing.test.ts --preload ./tests/integration/preload.ts

      - name: Summary
        run: |
          echo ""
          echo "================================"
          echo "✅ Local CI Pipeline Complete!"
          echo "================================"
          echo ""
          echo "Completed steps:"
          echo "  ✓ Type check"
          echo "  ✓ Lint"
          echo "  ✓ Build"
          echo "  ✓ Unit tests"
          echo "  ✓ Integration tests"
          echo ""
          echo "Note: E2E tests are not included in local CI."
          echo "Run 'bun run test:e2e' separately if needed."
