name: Benchmark Suite

on:
  # Run after training workflow completes
  workflow_run:
    workflows: ["RL Training"]
    types:
      - completed

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Specific scenario to run (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'bull-market'
          - 'bear-market'
          - 'scandal-unfolds'
          - 'pump-and-dump'
      baseline:
        description: 'Baseline strategy'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'momentum'
      archetype:
        description: 'Archetype to test'
        required: false
        default: 'trader'
        type: choice
        options:
          - 'trader'
          - 'degen'
          - 'scammer'
          - 'researcher'
          - 'social-butterfly'
      quick:
        description: 'Quick mode (faster but less thorough)'
        required: false
        default: false
        type: boolean

  # Nightly full benchmark
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmark suite
        id: benchmark
        run: |
          ARGS=""
          
          # Add scenario if specified
          if [ -n "${{ github.event.inputs.scenario }}" ]; then
            ARGS="$ARGS --scenario ${{ github.event.inputs.scenario }}"
          fi
          
          # Add baseline
          BASELINE="${{ github.event.inputs.baseline || 'random' }}"
          ARGS="$ARGS --baseline $BASELINE"
          
          # Add archetype
          ARCHETYPE="${{ github.event.inputs.archetype || 'trader' }}"
          ARGS="$ARGS --archetype $ARCHETYPE"
          
          # Add quick flag if specified
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            ARGS="$ARGS --quick"
          fi
          
          # Set output directory
          OUTPUT_DIR="benchmark-results/ci-${{ github.run_id }}"
          ARGS="$ARGS --output $OUTPUT_DIR"
          
          echo "Running: bun run packages/training/scripts/run-benchmark-suite.ts $ARGS"
          bun run packages/training/scripts/run-benchmark-suite.ts $ARGS
          
          # Export output directory for artifact upload
          echo "output_dir=$OUTPUT_DIR" >> $GITHUB_OUTPUT

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmark-results/ci-${{ github.run_id }}/
          retention-days: 30

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const outputDir = '${{ steps.benchmark.outputs.output_dir }}';
            const reportPath = path.join(outputDir, 'report.txt');
            
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 📊 Benchmark Results\n\n\`\`\`\n${report}\n\`\`\``
              });
            }

      - name: Check benchmark verdict
        run: |
          REPORT_JSON="benchmark-results/ci-${{ github.run_id }}/report.json"
          
          if [ -f "$REPORT_JSON" ]; then
            VERDICT=$(jq -r '.summary.overallVerdict' "$REPORT_JSON")
            
            echo "Benchmark verdict: $VERDICT"
            
            if [ "$VERDICT" = "regression" ]; then
              echo "::error::Benchmark shows regression - model performance is worse than baseline"
              exit 1
            elif [ "$VERDICT" = "deploy" ]; then
              echo "::notice::Benchmark passed - model ready for deployment"
            else
              echo "::warning::Benchmark shows mixed results - continue training"
            fi
          else
            echo "::warning::No benchmark report found"
          fi

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: benchmark
    if: failure()

    steps:
      - name: Post failure notification
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            
            // Create an issue or comment about the failure
            console.log('Benchmark failed - would notify team here');
            
            // Could also send to Slack, Discord, etc.

