name: Preview Deploy

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy Preview
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PREVIEW_DEPLOY_ENABLED: ${{ vars.ENABLE_PREVIEW_DEPLOY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vercel credentials
        id: vercel-creds
        run: |
          if [ "${PREVIEW_DEPLOY_ENABLED}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "missing=ENABLE_PREVIEW_DEPLOY variable (set to true to enable)" >> "$GITHUB_OUTPUT"
            echo "Preview deploy is disabled by repository variable ENABLE_PREVIEW_DEPLOY"
            exit 0
          fi

          missing=()
          [ -z "${VERCEL_TOKEN}" ] && missing+=("VERCEL_TOKEN")
          [ -z "${VERCEL_ORG_ID}" ] && missing+=("VERCEL_ORG_ID")
          [ -z "${VERCEL_PROJECT_ID}" ] && missing+=("VERCEL_PROJECT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "Missing required Vercel secrets: ${missing[*]}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        if: steps.vercel-creds.outputs.skip != 'true'
        run: npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy preview to Vercel
        id: deploy
        if: steps.vercel-creds.outputs.skip != 'true'
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT="$(npx vercel@latest deploy --yes --token="$VERCEL_TOKEN" 2>&1)"
          echo "$DEPLOY_OUTPUT"

          PREVIEW_URL="$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+' | grep -E 'vercel\.app|vercel\.link|\.now\.sh' | tail -n 1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not parse preview URL from Vercel deploy output"
            exit 1
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $PREVIEW_URL"

      - name: Add preview comment to PR
        if: steps.vercel-creds.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- preview-deploy-comment -->';
            const body = `${marker}
            Preview deployment is ready

            ${process.env.PREVIEW_URL}`;

            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Skip notice
        if: steps.vercel-creds.outputs.skip == 'true'
        run: |
          echo "Skipping preview deploy. Missing secrets: ${{ steps.vercel-creds.outputs.missing }}"
