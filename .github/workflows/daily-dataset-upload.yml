name: Daily HuggingFace Dataset Upload

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force:
        description: 'Force upload even if no new data'
        required: false
        default: 'false'

jobs:
  upload-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # GitHub Actions has plenty of time
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Setup Python (for huggingface-cli)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install huggingface_hub
          huggingface-cli --version
      
      - name: Install dependencies
        run: bun install
      
      - name: Setup database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Database configured"
          bun run prisma generate
      
      - name: Collect and prepare game data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📊 Collecting all game data..."
          npx tsx scripts/collect-game-data-for-hf.ts
      
      - name: Upload to HuggingFace
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_DATASET_NAME: elizaos/babylon-game-data
        run: |
          echo "📤 Uploading to HuggingFace..."
          npx tsx scripts/upload-to-huggingface.ts
      
      - name: Verify upload
        run: |
          echo "✅ Verifying upload..."
          npx tsx scripts/verify-hf-upload.ts
      
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: upload-summary
          path: exports/huggingface/latest/summary.json
          retention-days: 30


